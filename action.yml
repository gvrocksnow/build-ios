name: "Build iOS app"

# on: [push]
on: [workflow_dispatch]

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: build archive and ipaify
        run: |
          wget -O archive.zip "YOURLINKHERE"
          unzip archive.zip -d .

          # Detect the project name from the export (it changes with each version bump)
          PROJ_PATH=$(find . -maxdepth 4 -name "*.xcodeproj" -not -path "*/Pods/*" | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            echo "::error::No .xcodeproj found in the downloaded archive"
            find . -maxdepth 3 -not -path "./.git*"
            exit 1
          fi
          cd "$(dirname "$PROJ_PATH")"
          PROJ=$(basename "$PROJ_PATH")
          NAME="${PROJ%.xcodeproj}"
          echo "Building $NAME"

          xcodebuild archive -project "$PROJ" -scheme "$NAME" -archivePath "$NAME.xcarchive" -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

          mkdir Payload
          mv "$NAME.xcarchive/Products/Applications/$NAME.app" "Payload/$NAME.app"

          zip -r "Example-Project.ipa" "Payload"

          mv Example-Project.ipa ${{ runner.temp }}/Example-Project.ipa


      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Example-Project
          path: ${{ runner.temp }}/Example-Project.ipa
          # you can also archive the entire directory
          # path: ${{ runner.temp }}/build
          retention-days: 3
