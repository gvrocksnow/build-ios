name: "Build iOS app"

# on: [push]
on:
  workflow_dispatch:
    inputs:
      ipa_name:
        description: "IPA file name (without .ipa)"
        required: true
        type: string

jobs:
  build_ios:
    runs-on: macos-latest
    env:
      IPA_NAME: ${{ inputs.ipa_name }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: build archive and ipaify
        run: |
          IPA_NAME="${IPA_NAME%.ipa}"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

          wget -O archive.zip "YOURLINKHERE"
          unzip -q archive.zip -d export

          # Godot names the .xcodeproj after the export path, so detect it instead of hardcoding the version
          PROJ_PATH=$(find export -maxdepth 4 -name "*.xcodeproj" -not -path "*/Pods/*" | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            echo "::error::No .xcodeproj found in the downloaded archive"
            find export -maxdepth 3
            exit 1
          fi
          PROJECT_NAME=$(basename "$PROJ_PATH" .xcodeproj)
          echo "Using Xcode project: $PROJ_PATH"
          cd "$(dirname "$PROJ_PATH")"

          xcodebuild archive -project "$PROJECT_NAME.xcodeproj" -scheme "$PROJECT_NAME" -archivePath "$PROJECT_NAME.xcarchive" -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

          mkdir Payload
          mv "$PROJECT_NAME.xcarchive/Products/Applications/$PROJECT_NAME.app" "Payload/$PROJECT_NAME.app"

          zip -r "$IPA_NAME.ipa" "Payload"

          mv "$IPA_NAME.ipa" "$RUNNER_TEMP/$IPA_NAME.ipa"


      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ runner.temp }}/${{ env.IPA_NAME }}.ipa
          # you can also archive the entire directory
          # path: ${{ runner.temp }}/build
          retention-days: 3
